server.port=${PORT:8080}
# Database credentials come from environment variables (never commit passwords)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hospital_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# JWT: set a long random JWT_SECRET (32+ chars) in production
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
jwt.expiration-ms=86400000
# Default admin account created on first start
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
# Origins allowed when the frontend is served separately (comma separated)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}
