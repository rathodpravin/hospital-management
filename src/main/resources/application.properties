# ==========================================
# Application Configuration
# ==========================================
spring.application.name=hospital-management
server.port=${PORT:8080}


# ==========================================
# Aiven MySQL Database Configuration
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ==========================================
# JWT Security Configuration
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000


# ==========================================
# Admin Account Configuration
# ==========================================
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}


# ==========================================
# Logging Configuration
# ==========================================
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO